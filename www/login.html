<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <title>Login | PM2 Panel</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-base-200 flex items-center justify-center">
    <div class="card bg-base-100 shadow-xl w-96">
        <div class="card-body">
            <h2 class="card-title text-2xl mb-4 justify-center">PM2 Panel</h2>
            <p class="text-center text-sm opacity-60 mb-4">Sign in to manage your processes</p>
            
            <div id="error" class="alert alert-error hidden">
                <span id="error-msg"></span>
            </div>
            
            <form method="post" action="/loginCheck">
                <div class="form-control w-full">
                    <label class="label"><span class="label-text">Username</span></label>
                    <input type="text" name="username" placeholder="Enter username" class="input input-bordered w-full" required />
                </div>
                <div class="form-control w-full mt-2">
                    <label class="label"><span class="label-text">Password</span></label>
                    <input type="password" name="passwd" placeholder="Enter password" class="input input-bordered w-full" required />
                </div>
                <div class="form-control mt-2">
                    <label class="label cursor-pointer justify-start gap-2">
                        <input type="checkbox" name="remember" value="1" class="checkbox checkbox-sm" />
                        <span class="label-text">Remember me</span>
                    </label>
                </div>
                <div class="form-control mt-6">
                    <button type="submit" class="btn btn-primary">Login</button>
                </div>
            </form>
        </div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const err = params.get('err');
        if (err) {
            document.getElementById('error').classList.remove('hidden');
            document.getElementById('error-msg').textContent = 
                err === 'invalid_credentials' ? 'Invalid username or password' : 'A system error occurred';
        }
    </script>
</body>
</html>
